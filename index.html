<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de Seguridad Económica · propuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F7F6; --surface2:#EDF1EF; --ink:#172026; --ink2:#3A464D; --muted:#5E6A71; --line:#E3E7EA;
  --inc:#12A150; --inc-t:#0B7A3B; --buf:#2F6BFF; --shock:#FF5A1F; --shock-t:#C2410C; --debt:#C81D6B; --card:#7A0F45; --fam:#6E44D9; --pub:#0E8F9A; --cut:#A3ADB3; --arr:#B42318; --hl:#FFD23F;
  --f-title:"Archivo","Helvetica Neue",sans-serif; --f-body:"Public Sans","Helvetica Neue",sans-serif; --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1417; --surface:#172026; --surface2:#1D282F; --ink:#EEF2F3; --ink2:#C9D2D6; --muted:#9AA6AC; --line:#2A363D;
  --inc:#2BC46B; --inc-t:#4FD487; --buf:#5B8CFF; --shock:#FF7A45; --shock-t:#FF915F; --debt:#EC4C93; --card:#C2417F; --fam:#9A7BFF; --pub:#2FC0CB; --cut:#6E7B82; --arr:#F0645A; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1417; --surface:#172026; --surface2:#1D282F; --ink:#EEF2F3; --ink2:#C9D2D6; --muted:#9AA6AC; --line:#2A363D;
  --inc:#2BC46B; --inc-t:#4FD487; --buf:#5B8CFF; --shock:#FF7A45; --shock-t:#FF915F; --debt:#EC4C93; --card:#C2417F; --fam:#9A7BFF; --pub:#2FC0CB; --cut:#6E7B82; --arr:#F0645A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
a{color:var(--buf)}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.mono{font-family:var(--f-mono)}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit}
h1,h2,h3,h4{font-family:var(--f-title);font-stretch:125%;font-weight:850;line-height:1.02;letter-spacing:-.01em;margin:0}
h2{font-size:clamp(30px,4.2vw,46px)}
h3{font-size:clamp(21px,2.4vw,26px);font-stretch:112%;font-weight:800}
p{margin:0}

/* barra superior */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;min-height:66px;flex-wrap:wrap;padding-block:8px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-title);font-stretch:125%;font-weight:800;font-size:17px}
.brand svg{flex:none}
.nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink2);font-weight:600;padding:10px 14px;border-radius:999px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.lang{margin-left:6px;min-height:40px;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:0 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.lang span{opacity:.45}.lang span.on{opacity:1}

/* inicio */
.home{padding-block:clamp(56px,10vw,110px) 80px;text-align:center}
.home h1{font-size:clamp(40px,6.4vw,76px);max-width:15ch;margin:0 auto}
.home .lead{max-width:640px;margin:22px auto 0;font-size:19px;color:var(--ink2)}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:48px;text-align:left}
@media (max-width:760px){.doors{grid-template-columns:minmax(0,1fr)}}
.door{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid transparent;border-radius:24px;padding:30px 30px 26px;min-height:270px;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--ink);transform:translateY(-2px)}
.door.lab{background:var(--ink);color:var(--bg)}
.door.lab .door-sub{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.door h2{font-size:clamp(26px,3vw,34px)}
.door-sub{color:var(--ink2);font-size:16.5px;max-width:42ch}
.door .go{margin-top:auto;display:inline-flex;align-items:center;gap:10px;font-weight:700}
.door .icons{display:flex;gap:8px}
.home .note{margin-top:30px;color:var(--muted);font-size:14.5px}

/* aprender */
.learn section{padding-block:56px;border-top:1px solid var(--line)}
.learn section:first-child{border-top:0}
.statement{text-align:center;padding-block:72px 56px!important}
.statement h2{font-size:clamp(34px,5vw,58px);max-width:20ch;margin:0 auto}
.statement p{max-width:680px;margin:20px auto 0;font-size:18.5px;color:var(--ink2)}
.formula{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:30px;font-weight:700}
.formula .t{padding:10px 16px;border-radius:999px;background:var(--surface)}
.formula .t.s{background:color-mix(in srgb,var(--shock) 14%,var(--bg));color:var(--shock-t)}
.formula .t.b{background:color-mix(in srgb,var(--buf) 13%,var(--bg));color:var(--buf)}
.formula .t.r{background:var(--ink);color:var(--bg)}
.formula .op{font-family:var(--f-mono);font-size:22px;color:var(--muted)}
.sec-head{display:grid;gap:12px;margin-bottom:28px;max-width:720px}
.sec-head.right{margin-left:auto;text-align:right}
.sec-head.center{margin-inline:auto;text-align:center}
.sec-head p{color:var(--ink2);font-size:17.5px}
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.layers{grid-template-columns:minmax(0,1fr)}}
.layer{border-radius:20px;padding:22px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.layer .k{font-family:var(--f-mono);font-size:13px;font-weight:500}
.layer.a .k{color:var(--shock-t)}.layer.b .k{color:var(--buf)}.layer.c .k{color:var(--debt)}
.layer ul{margin:4px 0 0;padding-left:18px;color:var(--ink2)}
.chains{display:grid;gap:10px;margin-top:18px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}
.chain span{background:var(--surface);border-radius:999px;padding:5px 12px}
.chain i{font-style:normal;color:var(--muted)}
.mechs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:860px){.mechs{grid-template-columns:minmax(0,1fr)}}
details.mech{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--bg)}
details.mech summary{list-style:none;cursor:pointer;padding:18px 20px;display:grid;grid-template-columns:44px minmax(0,1fr) 24px;gap:12px;align-items:center}
details.mech summary::-webkit-details-marker{display:none}
details.mech .n{font-family:var(--f-mono);font-size:13px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center}
details.mech .tt{font-weight:700;font-size:17px}
details.mech .ss{display:block;font-size:14.5px;color:var(--muted);font-weight:400}
details.mech .plus{font-size:22px;color:var(--muted);transition:transform .2s}
details.mech[open] .plus{transform:rotate(45deg)}
details.mech .body{padding:0 20px 20px 76px;display:grid;gap:10px;color:var(--ink2)}
details.mech .path{font-family:var(--f-mono);font-size:13px;color:var(--ink);background:var(--surface);border-radius:12px;padding:10px 12px}
details.mech .read{font-size:14px;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;margin-top:8px}
@media (max-width:760px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rung{border-radius:14px;padding:14px;color:#fff;font-weight:600;font-size:15px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.rung small{font-weight:400;opacity:.9;font-size:13px}
.ladder-scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:8px}
.evid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ev{border-radius:18px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:8px}
.ev .where{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.ev .big{font-family:var(--f-title);font-stretch:112%;font-weight:850;font-size:28px;line-height:1.05}
.ev .src{margin-top:auto;font-size:13.5px;color:var(--muted)}
.ev.cl .where{color:var(--inc-t);font-weight:500}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface);font-weight:700;font-size:14px}
tr:last-child td{border-bottom:0}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.route{border:1px solid var(--line);border-radius:18px;padding:20px}
.route h3{font-size:20px;margin-bottom:10px}
.route ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.route li span{display:block;color:var(--muted);font-size:13.5px}
.route li a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}.route li a:hover{text-decoration-color:var(--buf)}
.read a,.src a,.cite-me a,td a{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--buf) 55%,transparent);text-underline-offset:3px}
.read a:hover,.src a:hover,.cite-me a:hover,td a:hover{color:var(--buf)}
.cta{margin-top:28px;display:flex;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.shock{border-color:var(--shock);color:var(--shock-t)}
.btn.shock[aria-pressed="true"]{background:var(--shock);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* laboratorio */
.labhead{padding-block:44px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 32px;align-items:end}
@media (max-width:760px){.labhead{grid-template-columns:minmax(0,1fr)}}
.labhead p{color:var(--ink2);max-width:62ch;margin-top:12px;font-size:17.5px}
.modes{display:inline-flex;flex-wrap:wrap;background:var(--surface);border-radius:999px;padding:5px;gap:4px}
.modes a{text-decoration:none;color:var(--ink2);font-weight:700;padding:11px 18px;border-radius:999px;white-space:nowrap}
.modes a[aria-current="true"]{background:var(--ink);color:var(--bg)}

/* arma un hogar */
.build{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;padding-bottom:64px;align-items:start}
@media (max-width:960px){.build{grid-template-columns:minmax(0,1fr)}}
.steps{display:grid;gap:14px}
.step{border:2px solid var(--line);border-radius:22px;padding:20px 22px;display:grid;gap:14px;transition:border-color .2s,opacity .2s}
.step.active{border-color:var(--ink)}
.step.locked{opacity:.45}
.step-h{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.step-n{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:500;background:var(--surface);color:var(--ink)}
.step.active .step-n{background:var(--ink);color:var(--bg)}
.step.done .step-n{background:var(--inc);color:#fff}
.step-h h3{font-size:21px}
.step-h p{color:var(--muted);font-size:14.5px;margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;text-align:left;font-size:15px;line-height:1.25}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.opt.inc[aria-pressed="true"] .dot{background:var(--inc)}
.opt.load[aria-pressed="true"] .dot{background:var(--debt)}
.opt.buf[aria-pressed="true"] .dot{background:var(--buf)}
.opt.plus[aria-pressed="true"] .dot{background:var(--inc)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.sublabel{font-size:13.5px;font-weight:700;color:var(--ink2)}
.step-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.step-foot .hint{font-size:14px;color:var(--muted)}
.shocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shocks .btn{justify-content:center;border-radius:14px;min-height:52px}

.panel{position:sticky;top:84px;display:grid;gap:14px}
@media (max-width:960px){.panel{position:static}}
.card{border-radius:22px;background:var(--surface);padding:22px}
.strength-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.strength-top h3{font-size:20px}
.strength-val{font-family:var(--f-mono);font-size:40px;font-weight:500;line-height:1}
.sbar{height:22px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:14px;position:relative}
.sbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .45s cubic-bezier(.2,.7,.2,1),background .3s}
.sscale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;font-family:var(--f-mono)}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.part{background:var(--bg);border-radius:14px;padding:10px 12px}
.part b{display:block;font-family:var(--f-mono);font-weight:500;font-size:20px}
.part span{font-size:13px;color:var(--muted)}
.part.i b{color:var(--inc-t)}.part.c b{color:var(--buf)}.part.l b{color:var(--debt)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;min-height:30px}
.chip{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--bg);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%}
.empty{color:var(--muted);font-size:15px}
.impact h3{font-size:20px}
.impact .intro{color:var(--ink2);font-size:15px;margin-top:6px}
.meters{display:grid;gap:14px;margin-top:16px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter-top b{font-weight:700;font-size:15px}
.meter-top .v{font-family:var(--f-mono);font-size:18px;font-weight:500}
.mbar{height:12px;border-radius:999px;background:var(--surface2);position:relative;margin-top:6px}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .45s cubic-bezier(.2,.7,.2,1)}
.mbar .ghost{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2.5px dashed var(--ink);transition:left .45s}
.meter p{font-size:13.5px;color:var(--muted);margin-top:6px}
.legend-ghost{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:14px}
.legend-ghost i{width:0;height:14px;border-left:2.5px dashed var(--ink)}
.compare{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--bg);font-size:15px}
.disclaimer{font-size:13px;color:var(--muted)}

/* simulación */
.simgrid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start;padding-bottom:64px}
@media (max-width:1000px){.simgrid{grid-template-columns:minmax(0,1fr)}}
.controls{display:grid;gap:14px}
.presets{display:grid;gap:6px}
.preset{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);cursor:pointer;text-align:left;min-height:44px}
.preset[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.preset b{display:block;font-size:15px}
.preset span{font-size:13px;color:var(--muted)}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-size:13.5px;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.field label output{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ink)}
select{min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:0 10px;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1;min-height:38px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;font-size:14px;padding:0 8px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.shockrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}.shockrow select:first-child{grid-column:1/-1}
.box{border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.box h4{font-family:var(--f-title);font-stretch:112%;font-size:17px;font-weight:800}
.outs{display:grid;gap:16px;min-width:0}
.budget{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.budget{grid-template-columns:minmax(0,1fr)}}
.bcell{border-radius:16px;background:var(--surface);padding:14px 16px}
.bcell span{font-size:13.5px;color:var(--muted);display:block}
.bcell b{font-family:var(--f-mono);font-size:24px;font-weight:500}
.bcell.pos b{color:var(--inc-t)}.bcell.neg b{color:var(--debt)}
.chartbox{border:1px solid var(--line);border-radius:22px;padding:18px 18px 12px;min-width:0}
.chartbox h3{font-size:20px}
.chartbox .sub{font-size:14.5px;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .col{cursor:pointer}
.chart .col:hover rect.hit,.chart .col.sel rect.hit{fill:var(--ink);opacity:.06}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px}
.monthdet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.monthdet{grid-template-columns:minmax(0,1fr)}}
.rows{display:grid;gap:4px;font-size:14.5px}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.rows div:last-child{border-bottom:0}
.rows .m{font-family:var(--f-mono)}
.rows .tot{font-weight:700}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.story{display:grid;gap:6px;max-height:300px;overflow:auto;font-size:14.5px;padding-right:4px}
.story div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.story .mm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border-radius:16px;background:var(--surface);padding:14px}
.stat b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:500}
.stat span{font-size:13.5px;color:var(--ink2)}
.assump td:last-child{font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}
.foot{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--muted);font-size:14px}

/* paso a paso */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.live{display:grid;gap:16px;padding-bottom:64px}

.livectl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.livectl .seg button{min-width:48px}
.livecfg{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14.5px;color:var(--ink2)}
.livecfg select{width:auto;min-width:260px}
.stagewrap{border:1px solid var(--line);border-radius:24px;padding:16px 16px 12px;background:linear-gradient(var(--bg),var(--surface))}
.stagehead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lv-month{font-family:var(--f-title);font-stretch:112%;font-weight:850;font-size:24px;min-width:150px}
.lv-track{flex:1;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;min-width:220px}
.lv-track i{height:10px;border-radius:3px;background:var(--surface2)}
.lv-track i.done{background:var(--ink)}
.lv-track i.cur{background:var(--hl)}
.lv-track i.sh{box-shadow:inset 0 -3px 0 var(--shock)}
.stage{width:100%;min-width:720px;height:auto;display:block;margin-top:6px}
.stagescroll{overflow-x:auto}
.live>*{min-width:0}
.stage text{font-family:var(--f-body);fill:var(--ink)}
.stage .nlabel{font-weight:700;font-size:15px}
.stage .nbadge{font-family:var(--f-mono);font-size:12.5px;fill:var(--muted)}
.stage .edge{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.stage .edge.on{stroke:var(--ink);stroke-opacity:.35}
.stage .props text{font-size:13.5px}
.stage .props .v{font-family:var(--f-mono);font-size:13.5px}
.caption{min-height:52px;margin-top:6px;padding:10px 14px;border-radius:14px;background:var(--bg);font-size:15.5px}
.livegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
@media (max-width:900px){.livegrid{grid-template-columns:minmax(0,1fr)}}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.sumgrid .stat b{font-size:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<header class="top"><div class="wrap">
  <a class="brand" href="#inicio" data-go="inicio"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><circle cx="12" cy="14.5" r="3" stroke="var(--inc)"/></svg><span data-i18n="brand"></span></a>
  <nav class="nav" aria-label="Principal">
    <a href="#aprender" data-nav="aprender" data-i18n="navLearn"></a>
    <a href="#laboratorio" data-nav="laboratorio" data-i18n="navLab"></a>
    <button class="lang" id="lang" type="button" aria-label="Cambiar idioma / Change language"><span data-l="es">ES</span><span data-l="en">EN</span></button>
  </nav>
</div></header>

<main>
<!-- INICIO -->
<section id="v-inicio" class="wrap home">
  <h1 data-i18n-html="homeTitle"></h1>
  <p class="lead" data-i18n="homeLead"></p>
  <div class="doors">
    <a class="door" href="#aprender">
      <div class="icons" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 4h13v14H6a2 2 0 0 0-2 2z"/><path d="M4 20V5.5"/><path d="M9 8h6M9 11h4"/></svg></div>
      <h2 data-i18n="door1"></h2>
      <p class="door-sub" data-i18n="door1Sub"></p>
      <span class="go"><span data-i18n="door1Go"></span> →</span>
    </a>
    <a class="door lab" href="#laboratorio">
      <div class="icons" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9 16l2-2 2 1.5 3-3.5" stroke="var(--hl)"/></svg></div>
      <h2 data-i18n="door2"></h2>
      <p class="door-sub" data-i18n="door2Sub"></p>
      <span class="go"><span data-i18n="door2Go"></span> →</span>
    </a>
  </div>
  <p class="note" data-i18n="homeNote"></p>
</section>

<!-- APRENDER -->
<div id="v-aprender" class="wrap learn" hidden></div>

<!-- LABORATORIO -->
<section id="v-laboratorio" class="wrap" hidden>
  <div class="labhead">
    <div><h2 data-i18n="labTitle"></h2><p id="labIntro"></p></div>
    <nav class="modes" aria-label="Modo"><a href="#laboratorio/arma" data-mode="arma" data-i18n="modeBuild"></a><a href="#laboratorio/tiempo" data-mode="tiempo" data-i18n="modeTime"></a><a href="#laboratorio/vivo" data-mode="vivo" data-i18n="modeLive"></a></nav>
  </div>

  <!-- ARMA UN HOGAR -->
  <div id="m-arma" class="build">
    <div class="steps">
      <div class="step" id="st1">
        <div class="step-h"><span class="step-n">1</span><div><h3 data-i18n="s1T"></h3><p data-i18n="s1P"></p></div></div>
        <span class="sublabel" data-i18n="s1Inc"></span>
        <div class="opts" id="o-inc"></div>
        <span class="sublabel" data-i18n="s1Load"></span>
        <div class="opts" id="o-load"></div>
        <div class="step-foot"><span class="hint" id="h1"></span><button class="btn solid" id="next1" type="button" data-i18n="next"></button></div>
      </div>
      <div class="step locked" id="st2">
        <div class="step-h"><span class="step-n">2</span><div><h3 data-i18n="s2T"></h3><p data-i18n="s2P"></p></div></div>
        <div class="opts" id="o-buf"></div>
        <div class="step-foot"><span class="hint" data-i18n="s2Hint"></span><button class="btn solid" id="next2" type="button" data-i18n="next"></button></div>
      </div>
      <div class="step locked" id="st3">
        <div class="step-h"><span class="step-n">3</span><div><h3 data-i18n="s3T"></h3><p data-i18n="s3P"></p></div></div>
        <div class="shocks" id="o-shock"></div>
        <div class="step-foot"><span class="hint" data-i18n="s3Hint"></span><button class="btn" id="clearShock" type="button" data-i18n="clearShock"></button></div>
      </div>
      <div class="step-foot"><button class="btn" id="resetBuild" type="button" data-i18n="reset"></button><span class="disclaimer" data-i18n="buildDisc"></span></div>
    </div>

    <div class="panel">
      <div class="card" aria-live="polite">
        <div class="strength-top"><h3 data-i18n="strength"></h3><span class="strength-val" id="sv">—</span></div>
        <div class="sbar"><i id="sbar"></i></div>
        <div class="sscale"><span data-i18n="fragile"></span><span data-i18n="solid"></span></div>
        <div class="parts">
          <div class="part i"><b id="p-i">0</b><span data-i18n="partInc"></span></div>
          <div class="part c"><b id="p-c">0</b><span data-i18n="partBuf"></span></div>
          <div class="part l"><b id="p-l">0</b><span data-i18n="partLoad"></span></div>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="card impact" id="impact"></div>
    </div>
  </div>

  <!-- EN EL TIEMPO -->
  <div id="m-tiempo" class="simgrid" hidden>
    <div class="controls">
      <div class="box"><h4 data-i18n="pickHH"></h4><div class="presets" id="presets"></div></div>
      <div class="box">
        <h4 data-i18n="adjust"></h4>
        <div class="field"><label for="f-inc"><span data-i18n="fInc"></span><output id="o-f-inc"></output></label><input type="range" id="f-inc" min="250" max="4000" step="10"></div>
        <div class="field"><label for="f-exp"><span data-i18n="fExp"></span><output id="o-f-exp"></output></label><input type="range" id="f-exp" min="200" max="3500" step="10"></div>
        <div class="field"><label for="f-debt"><span data-i18n="fDebt"></span><output id="o-f-debt"></output></label><input type="range" id="f-debt" min="0" max="900" step="10"></div>
        <div class="field"><label for="f-sav"><span data-i18n="fSav"></span><output id="o-f-sav"></output></label><input type="range" id="f-sav" min="0" max="5000" step="50"></div>
        <div class="field"><span class="lbl" data-i18n="fJob"></span><div class="seg" id="f-formal"></div></div>
        <div class="field"><span class="lbl" data-i18n="fNet"></span><div class="seg" id="f-net"></div></div>
        <div class="field"><span class="lbl" data-i18n="fCard"></span><div class="seg" id="f-card"></div></div>
      </div>
      <div class="box">
        <h4 data-i18n="shocksT"></h4>
        <div class="field"><span class="lbl" data-i18n="shock1"></span><div class="shockrow"><select id="sh1t" aria-label="tipo"></select><select id="sh1m" aria-label="mes"></select><select id="sh1d" aria-label="duración"></select></div></div>
        <div class="field"><span class="lbl" data-i18n="shock2"></span><div class="shockrow"><select id="sh2t" aria-label="tipo"></select><select id="sh2m" aria-label="mes"></select><select id="sh2d" aria-label="duración"></select></div></div>
        <button class="btn" id="reroll" type="button" data-i18n="reroll"></button>
      </div>
    </div>

    <div class="outs">
      <div class="budget" id="budget"></div>
      <div class="chartbox">
        <h3 data-i18n="chart1T"></h3>
        <p class="sub" data-i18n="chart1S"></p>
        <svg class="chart" id="chart1" viewBox="0 0 960 330" role="img"></svg>
        <div class="legend" id="leg1"></div>
      </div>
      <div class="chartbox">
        <h3 id="mdT"></h3>
        <div class="monthdet" id="mdet" style="margin-top:12px"></div>
      </div>
      <div class="chartbox">
        <h3 data-i18n="chart2T"></h3>
        <p class="sub" data-i18n="chart2S"></p>
        <svg class="chart" id="chart2" viewBox="0 0 960 250" role="img"></svg>
        <div class="legend" id="leg2"></div>
      </div>
      <div class="chartbox">
        <h3 data-i18n="storyT"></h3>
        <p class="sub" data-i18n="storyS"></p>
        <div class="story" id="story" style="margin-top:10px"></div>
      </div>
      <div class="chartbox">
        <h3 data-i18n="mcT"></h3>
        <p class="sub" data-i18n="mcS"></p>
        <div class="stats" id="stats" style="margin-top:12px"></div>
      </div>
      <details class="chartbox"><summary style="cursor:pointer;font-weight:700" data-i18n="assumpT"></summary><div class="tbl" style="margin-top:12px"><table class="assump" id="assump"></table></div></details>
    </div>
  </div>

  <!-- PASO A PASO -->
  <div id="m-vivo" class="live" hidden>
    <div class="livebar">
      <div class="livectl">
        <button class="btn solid" id="lv-play" type="button"></button>
        <button class="btn" id="lv-step" type="button" data-i18n="lvStep"></button>
        <button class="btn" id="lv-reset" type="button" data-i18n="lvReset"></button>
        <div class="seg" id="lv-speed" role="group" aria-label="velocidad"></div>
      </div>
      <div class="livecfg"><label for="lv-preset" class="sr" data-i18n="pickHH"></label><select id="lv-preset"></select><span id="lv-shocks"></span></div>
    </div>
    <div class="stagewrap">
      <div class="stagehead"><span class="lv-month" id="lv-month"></span><div class="lv-track" id="lv-track"></div></div>
      <div class="stagescroll"><svg class="stage" id="stage" viewBox="0 40 960 520" role="img"></svg></div>
      <div class="caption" id="lv-caption" aria-live="polite"></div>
    </div>
    <div class="livegrid">
      <div class="chartbox"><h3 data-i18n="lvLogT"></h3><div class="story" id="lv-log" style="margin-top:10px"></div></div>
      <div class="chartbox" id="lv-sum"></div>
    </div>
  </div>
</section>
</main>

const LEARN={
es:`
<section class="statement">
  <h2>La inseguridad aparece cuando <span class="hl">los riesgos superan los colchones</span></h2>
  <p>La seguridad económica es la capacidad de sostener la vida cotidiana y proyectar el futuro frente a golpes, obligaciones y transiciones.</p>
  <div class="formula"><span class="t s">exposición a golpes y obligaciones</span><span class="op">−</span><span class="t b">colchones disponibles</span><span class="op">+</span><span class="t">cómo se interpreta el riesgo</span><span class="op">=</span><span class="t r">inseguridad económica</span></div>
  <p style="font-size:16px">No es una ecuación para calcular, sino un mapa para ordenar lo que sabemos. Dos personas en la misma situación material pueden vivirla de forma muy distinta según su historia, su clase y las instituciones que las rodean.</p>
</section>
<section>
  <div class="sec-head"><h2>Del riesgo a sus consecuencias</h2><p>El mismo riesgo produce resultados distintos según lo que haya en el medio.</p></div>
  <div class="layers">
    <div class="layer a"><span class="k">Exposición</span><h3>¿Dónde aparece el riesgo?</h3><ul><li>Ingreso bajo o variable</li><li>Desempleo, informalidad</li><li>Deudas y pagos rígidos</li><li>Gastos de vivienda, salud, educación y cuidados</li><li>Golpes familiares o laborales</li></ul></div>
    <div class="layer b"><span class="k">Colchones</span><h3>¿Qué amortigua el golpe?</h3><ul><li>Ahorro y liquidez</li><li>Patrimonio y vivienda</li><li>Apoyo y transferencias familiares</li><li>Crédito y seguros</li><li>Beneficios sociales y empleo protegido</li></ul></div>
    <div class="layer c"><span class="k">Resultados</span><h3>¿En qué se convierte?</h3><ul><li>Estrés financiero y salud mental</li><li>Estudios interrumpidos o postergados</li><li>Deuda defensiva</li><li>Movilidad descendente</li><li>Confianza, protesta o retraimiento</li></ul></div>
  </div>
  <div class="chains">
    <div class="chain"><span>Ingreso variable</span><i>→</i><span>poca liquidez</span><i>→</i><span>deuda o ayuda familiar</span><i>→</i><span>estrés financiero</span><i>→</i><span>salud deteriorada o estudios postergados</span></div>
    <div class="chain"><span>Estudios caros</span><i>→</i><span>familia que puede pagar</span><i>→</i><span>menos deuda y menos trabajo paralelo</span><i>→</i><span>termina la carrera</span><i>→</i><span>ventaja acumulada</span></div>
  </div>
</section>
<section>
  <div class="sec-head right"><h2>Ocho mecanismos</h2><p>Cada uno es una secuencia que la literatura documenta. Ábrelos para ver el camino y dónde leer más.</p></div>
  <div class="mechs">${[
   ["M1","Golpe sin colchón","Lo decisivo no es el golpe, sino si hay cómo absorberlo.","golpe → falta de liquidez o protección → deterioro material → estrés → cambio de trayectoria","Una enfermedad o un despido no tienen el mismo efecto en todos los hogares. La diferencia la ponen el ahorro, la familia, el crédito, los seguros y la política social.","Hacker et al. 2014 · Espinosa, Friedman y Yévenes 2014 · Bania y Leete 2022"],
   ["M2","La deuda como colchón y como carga","Sostiene en el corto plazo y puede debilitar en el mediano.","necesidad → crédito → continuidad → obligación futura → restricción o crisis","Importan su tipo, plazo, acreedor y cuánto pesa la cuota. En Chile, el crédito de consumo está mucho más extendido que el hipotecario.","Dwyer 2018 · Ruiz-Tagle y Vella 2016 · Lea, Webley y Levine 1993"],
   ["M3","La riqueza como protección invisible","Protege incluso cuando no se gasta.","activos → capacidad de absorber → continuidad → ventaja acumulada","El patrimonio funciona como seguro privado, respaldo familiar y libertad para tomar riesgos.","Killewald, Pfeffer y Schachner 2017 · Jeffrey, Smith y Hamilton 2026 · Rauscher 2016"],
   ["M4","Mezclas de bienestar","La seguridad viene de varias fuentes combinadas.","familia + Estado + mercado + deuda + comunidad → seguridad efectiva","Un mismo trabajo precario puede volverse precariedad vital o no según el apoyo familiar y estatal disponible.","Antonucci 2018"],
   ["M5","De lo objetivo a lo vivido","Ni toda vulnerabilidad se siente igual.","condición material → mediaciones → interpretación → experiencia subjetiva","Entre la situación material y la preocupación median expectativas, comparaciones, memoria de crisis, clase e instituciones.","Mau, Mewes y Schoeneck 2012 · Ayala-Hurtado 2026"],
   ["M6","El tiempo de la amenaza","La inseguridad opera en calendarios y futuros imaginados.","crisis pasadas + presente incierto + futuro no garantizado → inseguridad anticipada","Cuotas, contratos y renovaciones marcan su ritmo. Quien vivió caídas repetidas anticipa la siguiente y posterga decisiones.","Hill et al. 2017 · Bossert y D'Ambrosio 2013 · Ayala-Hurtado 2022"],
   ["M7","Trayectorias bajo restricción","Cambia decisiones de estudio, trabajo y familia.","poco colchón + costos altos + incertidumbre → decisión restringida → trayectoria desigual","Estudiar mientras se trabaja, endeudarse o postergar tener hijos son decisiones que se acumulan en el tiempo.","Jeffrey, Smith y Hamilton 2026 · Chesters 2019 · Antonucci 2018"],
   ["M8","Traducción política","Puede volverse solidaridad, protesta o retraimiento.","experiencia de inseguridad → interpretación → respuesta social","Según narrativas e instituciones, se traduce en demanda de protección, desconfianza o acción colectiva.","Bardhan 2022 · Mau, Mewes y Schoeneck 2012"]
  ].map(m=>`<details class="mech"><summary><span class="n">${m[0]}</span><span><span class="tt">${m[1]}</span><span class="ss">${m[2]}</span></span><span class="plus" aria-hidden="true">+</span></summary><div class="body"><div class="path">${m[3]}</div><p>${m[4]}</p><p class="read">Leer: ${m[5]}</p></div></details>`).join("")}</div>
</section>
<section>
  <div class="sec-head center"><h2>¿Puedes reunir dinero rápido?</h2><p>Ante una emergencia, los hogares bajan por una escalera de opciones. Quien no tiene los primeros peldaños llega antes a los más caros. Es la misma escalera que usa la simulación.</p></div>
  <div class="ladder">
    <div class="rung" style="background:var(--buf);min-height:90px">Ahorro propio<small>el colchón directo</small></div>
    <div class="rung" style="background:var(--cut);min-height:110px;color:var(--ink)">Recortar gastos<small>apretarse</small></div>
    <div class="rung" style="background:var(--fam);min-height:130px">Familia y amigos<small>depende de la red</small></div>
    <div class="rung" style="background:var(--debt);min-height:150px">Crédito bancario<small>si lo aprueban</small></div>
    <div class="rung" style="background:var(--card);min-height:170px">Avance o casa comercial<small>más caro</small></div>
    <div class="rung" style="background:var(--arr);min-height:190px">Dejar de pagar<small>atrasos</small></div>
  </div>
  <div class="ladder-scale"><span>menor costo</span><span>mayor costo</span></div>
  <p class="cite-me" style="margin-top:16px;color:var(--ink2);max-width:72ch">En Estados Unidos, cerca de uno de cada cuatro hogares declaró que ciertamente no podría reunir USD 2.000 en 30 días (Lusardi, Schneider y Tufano 2011). La fragilidad también apareció en hogares de ingresos medios.</p>
  <div class="cta"><a class="btn solid" href="#laboratorio/tiempo">Verlo en la simulación →</a></div>
</section>
<section>
  <div class="sec-head"><h2>Lo que muestra la evidencia</h2></div>
  <div class="evid">
    <div class="ev cl"><span class="where">Chile</span><span class="big">≈ 1 de 2</span><p>hogares urbanos acumulaba dos o más vulnerabilidades económicas entre 2007 y 2017. La falta de activos es lo que más pesa.</p><span class="src">Prieto 2022 · Encuesta Financiera de Hogares</span></div>
    <div class="ev cl"><span class="where">Chile</span><span class="big">USD 9,9 y 20</span><p>por persona al día separan vulnerabilidad alta, moderada y baja entre los no pobres.</p><span class="src">Prieto 2024 · Panel CASEN 2006–2009</span></div>
    <div class="ev cl"><span class="where">Chile y México</span><span class="big">Golpes recientes</span><p>son el principal factor detrás de las expectativas negativas sobre el futuro.</p><span class="src">Espinosa, Friedman y Yévenes 2014</span></div>
    <div class="ev cl"><span class="where">Chile</span><span class="big">Consumo &gt; hipoteca</span><p>El crédito de consumo atraviesa todos los grupos de ingreso; el hipotecario se concentra arriba.</p><span class="src">Ruiz-Tagle y Vella 2016</span></div>
    <div class="ev"><span class="where">EE.UU.</span><span class="big">25%</span><p>Umbral del Economic Security Index: perder un cuarto o más de los recursos sin ahorro líquido para cubrirlo.</p><span class="src">Hacker et al. 2014</span></div>
    <div class="ev"><span class="where">EE.UU.</span><span class="big">1,3–4,3%</span><p>más probabilidad de que empeore la salud por cada desviación estándar de volatilidad del ingreso, solo en hogares sin liquidez.</p><span class="src">Bania y Leete 2022</span></div>
    <div class="ev"><span class="where">Europa</span><span class="big">Ilíquido = frágil</span><p>Tener el patrimonio inmovilizado aumenta la fragilidad; la protección social la reduce.</p><span class="src">Brunetti, Giarda y Torricelli 2025</span></div>
    <div class="ev"><span class="where">19 países europeos</span><span class="big">Estado de bienestar</span><p>El gasto social reduce la inseguridad percibida.</p><span class="src">Mau, Mewes y Schoeneck 2012</span></div>
  </div>
</section>
<section>
  <div class="sec-head right"><h2>Cómo se mide</h2><p>Cada enfoque hace una pregunta distinta. Juntos cubren el fenómeno.</p></div>
  <div class="tbl"><table><thead><tr><th>Enfoque</th><th>La pregunta</th><th>Referencias</th><th>Datos típicos</th></tr></thead><tbody>
  <tr><td><b>Pérdidas no amortiguadas</b></td><td>¿Perdió una parte grande de sus recursos sin colchón líquido?</td><td>Hacker et al. 2014; Bossert y D'Ambrosio 2013</td><td>Paneles de hogares</td></tr>
  <tr><td><b>Índice multidimensional</b></td><td>¿Cuántas vulnerabilidades acumula a la vez?</td><td>Prieto 2022</td><td>Encuesta Financiera de Hogares</td></tr>
  <tr><td><b>Vulnerabilidad a la pobreza</b></td><td>¿Qué probabilidad tiene de caer en pobreza aunque hoy no sea pobre?</td><td>López-Calva y Ortiz-Juárez 2014; Prieto 2024</td><td>Panel CASEN</td></tr>
  <tr><td><b>Fragilidad financiera</b></td><td>¿Puede reunir dinero para una emergencia en poco tiempo?</td><td>Lusardi et al. 2011; Brunetti et al. 2025</td><td>Encuestas de hogares</td></tr>
  <tr><td><b>Inseguridad subjetiva</b></td><td>¿Teme perder su empleo, sus ingresos o su salud?</td><td>Mau et al. 2012; Espinosa et al. 2014</td><td>Encuestas de opinión y panel</td></tr>
  </tbody></table></div>
</section>
<section>
  <div class="sec-head center"><h2>Para leer</h2><p>Cuatro rutas, de la lectura más accesible a la más específica. Cada título lleva al artículo original.</p></div>
  <div class="routes">
    <div class="route"><h3>Medir la seguridad económica</h3><ol><li>The Economic Security Index<span>Hacker et al. 2014</span></li><li>Measuring Economic Insecurity<span>Bossert y D'Ambrosio 2013</span></li><li>A Multidimensional Approach… Chile<span>Prieto 2022</span></li><li>Degrees of vulnerability to poverty<span>Prieto 2024</span></li></ol></div>
    <div class="route"><h3>Entender la deuda</h3><ol><li>Credit, Debt, and Inequality<span>Dwyer 2018</span></li><li>The economic psychology of consumer debt<span>Lea, Webley y Levine 1993</span></li><li>Borrowing Constraints and Credit Demand<span>Ruiz-Tagle y Vella 2016</span></li><li>Financial Fragility Across Europe<span>Brunetti et al. 2025</span></li></ol></div>
    <div class="route"><h3>Juventud y futuro</h3><ol><li>Not all experiences of precarious work lead to precarity<span>Antonucci 2018</span></li><li>Narrative Continuity/Rupture<span>Ayala-Hurtado 2022</span></li><li>Hidden Advantage along the Pipeline<span>Jeffrey, Smith y Hamilton 2026</span></li><li>Passing It On<span>Rauscher 2016</span></li></ol></div>
    <div class="route"><h3>Subjetividad y política</h3><ol><li>What determines subjective socio-economic insecurity?<span>Mau, Mewes y Schoeneck 2012</span></li><li>Qualities and Configurations of Insecurity<span>Ayala-Hurtado 2026</span></li><li>Household Economic Instability and Social Policy<span>Hill et al. 2017</span></li><li>A world of insecurity<span>Bardhan 2022</span></li></ol></div>
  </div>
  <div class="cta"><a class="btn solid" href="#laboratorio">Ir al laboratorio →</a></div>
</section>`,

<section class="statement">
  <h2>Insecurity appears when <span class="hl">risks outweigh cushions</span></h2>
  <p>Economic security is the capacity to sustain everyday life and plan for the future in the face of shocks, obligations and transitions.</p>
  <div class="formula"><span class="t s">exposure to shocks and obligations</span><span class="op">−</span><span class="t b">available cushions</span><span class="op">+</span><span class="t">how risk is interpreted</span><span class="op">=</span><span class="t r">economic insecurity</span></div>
  <p style="font-size:16px">It is not an equation to compute but a map to organize what we know. Two people in the same material situation can experience it very differently depending on their history, their class and the institutions around them.</p>
</section>
<section>
  <div class="sec-head"><h2>From risk to consequences</h2><p>The same risk produces different outcomes depending on what stands in between.</p></div>
  <div class="layers">
    <div class="layer a"><span class="k">Exposure</span><h3>Where does risk appear?</h3><ul><li>Low or variable income</li><li>Unemployment, informality</li><li>Debts and rigid payments</li><li>Housing, health, education and care costs</li><li>Family or job shocks</li></ul></div>
    <div class="layer b"><span class="k">Cushions</span><h3>What absorbs the shock?</h3><ul><li>Savings and liquidity</li><li>Wealth and housing</li><li>Family support and transfers</li><li>Credit and insurance</li><li>Social benefits and protected jobs</li></ul></div>
    <div class="layer c"><span class="k">Outcomes</span><h3>What does it turn into?</h3><ul><li>Financial stress and mental health</li><li>Interrupted or postponed studies</li><li>Defensive debt</li><li>Downward mobility</li><li>Trust, protest or withdrawal</li></ul></div>
  </div>
  <div class="chains">
    <div class="chain"><span>Variable income</span><i>→</i><span>little liquidity</span><i>→</i><span>debt or family help</span><i>→</i><span>financial stress</span><i>→</i><span>worse health or postponed studies</span></div>
    <div class="chain"><span>Costly studies</span><i>→</i><span>family that can pay</span><i>→</i><span>less debt and less side work</span><i>→</i><span>degree completed</span><i>→</i><span>accumulated advantage</span></div>
  </div>
</section>
<section>
  <div class="sec-head right"><h2>Eight mechanisms</h2><p>Each is a sequence documented in the literature. Open one to see the path and where to read more.</p></div>
  <div class="mechs">${[
   ["M1","Shock without a cushion","What matters is not the shock but whether it can be absorbed.","shock → lack of liquidity or protection → material decline → stress → change of trajectory","An illness or a layoff does not hit every household the same way. Savings, family, credit, insurance and social policy make the difference.","Hacker et al. 2014 · Espinosa, Friedman & Yévenes 2014 · Bania & Leete 2022"],
   ["M2","Debt as cushion and as burden","It sustains in the short run and can weaken in the medium run.","need → credit → continuity → future obligation → constraint or crisis","Type, term, lender and the weight of the installment matter. In Chile, consumer credit is far more widespread than mortgages.","Dwyer 2018 · Ruiz-Tagle & Vella 2016 · Lea, Webley & Levine 1993"],
   ["M3","Wealth as invisible protection","It protects even when it is not spent.","assets → capacity to absorb → continuity → accumulated advantage","Wealth works as private insurance, family backing and freedom to take risks.","Killewald, Pfeffer & Schachner 2017 · Jeffrey, Smith & Hamilton 2026 · Rauscher 2016"],
   ["M4","Welfare mixes","Security comes from several sources combined.","family + state + market + debt + community → effective security","The same precarious job may or may not become precarious living depending on family and state support.","Antonucci 2018"],
   ["M5","From objective to lived","Not every vulnerability feels the same.","material condition → mediations → interpretation → subjective experience","Expectations, comparisons, memory of crises, class and institutions stand between material conditions and worry.","Mau, Mewes & Schoeneck 2012 · Ayala-Hurtado 2026"],
   ["M6","The timing of threat","Insecurity runs on calendars and imagined futures.","past crises + uncertain present + unguaranteed future → anticipated insecurity","Installments, contracts and renewals set its rhythm. Those who lived repeated falls anticipate the next one and postpone decisions.","Hill et al. 2017 · Bossert & D'Ambrosio 2013 · Ayala-Hurtado 2022"],
   ["M7","Constrained trajectories","It changes decisions about study, work and family.","little cushion + high costs + uncertainty → constrained choice → unequal trajectory","Working while studying, borrowing or postponing children are decisions that accumulate over time.","Jeffrey, Smith & Hamilton 2026 · Chesters 2019 · Antonucci 2018"],
   ["M8","Political translation","It can become solidarity, protest or withdrawal.","experience of insecurity → interpretation → social response","Depending on narratives and institutions, it turns into demands for protection, distrust or collective action.","Bardhan 2022 · Mau, Mewes & Schoeneck 2012"]
  ].map(m=>`<details class="mech"><summary><span class="n">${m[0]}</span><span><span class="tt">${m[1]}</span><span class="ss">${m[2]}</span></span><span class="plus" aria-hidden="true">+</span></summary><div class="body"><div class="path">${m[3]}</div><p>${m[4]}</p><p class="read">Read: ${m[5]}</p></div></details>`).join("")}</div>
</section>
<section>
  <div class="sec-head center"><h2>Can you raise money fast?</h2><p>In an emergency, households climb down a ladder of options. Those without the first rungs reach the costly ones sooner. The simulation uses this same ladder.</p></div>
  <div class="ladder">
    <div class="rung" style="background:var(--buf);min-height:90px">Own savings<small>the direct cushion</small></div>
    <div class="rung" style="background:var(--cut);min-height:110px;color:var(--ink)">Cut spending<small>tighten the belt</small></div>
    <div class="rung" style="background:var(--fam);min-height:130px">Family and friends<small>depends on the network</small></div>
    <div class="rung" style="background:var(--debt);min-height:150px">Bank loan<small>if approved</small></div>
    <div class="rung" style="background:var(--card);min-height:170px">Cash advance or store credit<small>more expensive</small></div>
    <div class="rung" style="background:var(--arr);min-height:190px">Stop paying<small>arrears</small></div>
  </div>
  <div class="ladder-scale"><span>lower cost</span><span>higher cost</span></div>
  <p class="cite-me" style="margin-top:16px;color:var(--ink2);max-width:72ch">In the United States, about one in four households said they certainly could not raise USD 2,000 in 30 days (Lusardi, Schneider & Tufano 2011). Fragility also appeared among middle-income households.</p>
  <div class="cta"><a class="btn solid" href="#laboratorio/tiempo">See it in the simulation →</a></div>
</section>
<section>
  <div class="sec-head"><h2>What the evidence shows</h2></div>
  <div class="evid">
    <div class="ev cl"><span class="where">Chile</span><span class="big">≈ 1 in 2</span><p>urban households accumulated two or more economic vulnerabilities between 2007 and 2017. Lack of assets weighs most.</p><span class="src">Prieto 2022 · Household Finance Survey</span></div>
    <div class="ev cl"><span class="where">Chile</span><span class="big">USD 9.9 and 20</span><p>per person per day separate high, moderate and low vulnerability among the non-poor.</p><span class="src">Prieto 2024 · CASEN Panel 2006–2009</span></div>
    <div class="ev cl"><span class="where">Chile and Mexico</span><span class="big">Recent shocks</span><p>are the main factor behind negative expectations about the future.</p><span class="src">Espinosa, Friedman & Yévenes 2014</span></div>
    <div class="ev cl"><span class="where">Chile</span><span class="big">Consumer &gt; mortgage</span><p>Consumer credit cuts across all income groups; mortgages concentrate at the top.</p><span class="src">Ruiz-Tagle & Vella 2016</span></div>
    <div class="ev"><span class="where">USA</span><span class="big">25%</span><p>Threshold of the Economic Security Index: losing a quarter or more of resources without liquid savings to cover it.</p><span class="src">Hacker et al. 2014</span></div>
    <div class="ev"><span class="where">USA</span><span class="big">1.3–4.3%</span><p>higher probability of worse health per standard deviation of income volatility, only in households without liquidity.</p><span class="src">Bania & Leete 2022</span></div>
    <div class="ev"><span class="where">Europe</span><span class="big">Illiquid = fragile</span><p>Tied-up wealth increases fragility; social protection reduces it.</p><span class="src">Brunetti, Giarda & Torricelli 2025</span></div>
    <div class="ev"><span class="where">19 European countries</span><span class="big">Welfare state</span><p>Social spending reduces perceived insecurity.</p><span class="src">Mau, Mewes & Schoeneck 2012</span></div>
  </div>
</section>
<section>
  <div class="sec-head right"><h2>How it is measured</h2><p>Each approach asks a different question. Together they cover the phenomenon.</p></div>
  <div class="tbl"><table><thead><tr><th>Approach</th><th>The question</th><th>References</th><th>Typical data</th></tr></thead><tbody>
  <tr><td><b>Unbuffered losses</b></td><td>Did it lose a large share of resources without a liquid cushion?</td><td>Hacker et al. 2014; Bossert & D'Ambrosio 2013</td><td>Household panels</td></tr>
  <tr><td><b>Multidimensional index</b></td><td>How many vulnerabilities does it accumulate at once?</td><td>Prieto 2022</td><td>Household Finance Survey</td></tr>
  <tr><td><b>Vulnerability to poverty</b></td><td>How likely is it to fall into poverty even if not poor today?</td><td>López-Calva & Ortiz-Juárez 2014; Prieto 2024</td><td>CASEN Panel</td></tr>
  <tr><td><b>Financial fragility</b></td><td>Can it raise money for an emergency quickly?</td><td>Lusardi et al. 2011; Brunetti et al. 2025</td><td>Household surveys</td></tr>
  <tr><td><b>Subjective insecurity</b></td><td>Does it fear losing its job, income or health?</td><td>Mau et al. 2012; Espinosa et al. 2014</td><td>Opinion and panel surveys</td></tr>
  </tbody></table></div>
</section>

const INC={formal:34,informal:12,pension:24};
const LOAD={second:-14,rent:14,mort:12,kids:12,care:10,cons:16,stud:8};
const BUF={sav:18,fam:12,unemp:8,health:7,state:7,credit:5,home:8};
const SHK={job:{S:48,M:{sav:16,fam:10,unemp:14,state:6,second:14,credit:4}},ill:{S:38,M:{health:16,sav:12,fam:10,state:4,credit:4}},prices:{S:22,M:{second:6,sav:6,state:6}},repair:{S:26,M:{sav:14,fam:8,credit:8}}};
const HOUSING=['rent','mort'];
const B={inc:null,load:new Set(),buf:new Set(),shock:new Set(),step:1};
function bClamp(x,a,b){return Math.max(a,Math.min(b,x))}
function bState(){
  if(!B.inc)return null;
  const stab=INC[B.inc]+(B.load.has('second')?14:0);
  let L=0;B.load.forEach(k=>{if(k!=='second')L+=LOAD[k]});
  let Bf=0;B.buf.forEach(k=>Bf+=BUF[k]);
  const F=bClamp(Math.round(18+stab+Bf-L),3,100);
  return {stab,L,Bf,F};
}
function bImpact(st,withBuf){
  let I=0;B.shock.forEach(k=>{const s=SHK[k];let S=s.S;if(k==='job'&&B.inc==='pension')S=28;
    let M=0;for(const b in s.M){if(b==='second'){if(B.load.has('second'))M+=s.M[b]}else if(withBuf&&B.buf.has(b))M+=s.M[b]}
    I+=Math.max(3,S*(1+st.L/60)*(1.25-st.stab/100)-M)});
  const fam=withBuf&&B.buf.has('fam'),cr=withBuf&&B.buf.has('credit'),state=withBuf&&B.buf.has('state');
  return {I:Math.round(I),obl:bClamp(Math.round(100-1.3*I),2,98),debt:bClamp(Math.round(8+1.25*I+(cr?0:6)),2,98),rec:bClamp(Math.round(1+I/6),1,36),
    stress:bClamp(Math.round(12+I+(fam?0:10)+(B.load.has('kids')?6:0)-(state?4:0)),2,98),fam,cr};
}

function meter(label,val,ghost,unitTxt,desc,color,maxV){const w=Math.round(val/maxV*100),g=ghost==null?null:Math.round(ghost/maxV*100);

function renderPanel(){

  else{sv.textContent=st.F;sb.style.width=st.F+'%';sb.style.background=st.F<35?'var(--shock)':st.F<60?'var(--hl)':'var(--inc)';

const PRESETS={
 madre:{inc:520,share:.88,exp:512,debt:0,debtLeft:0,sav:0,formal:false,net:'algo',card:true,sh:[['job',4,4],['none',10,1]]},
 dos:{inc:1300,share:.6,exp:1165,debt:100,debtLeft:12,sav:150,formal:true,net:'algo',card:true,sh:[['job',4,4],['none',12,1]]},
 clase:{inc:2340,share:.55,exp:1690,debt:607,debtLeft:240,sav:500,formal:true,net:'algo',card:true,sh:[['job',4,4],['none',14,1]]},
 mayores:{inc:464,share:0,exp:406,debt:0,debtLeft:0,sav:0,formal:false,net:'debil',card:false,sh:[['ill',4,3],['prices',12,1]]}
};
const P={preset:'dos',seed:7};
function loadPreset(id){Object.assign(P,JSON.parse(JSON.stringify(PRESETS[id])),{preset:id})}
loadPreset('dos');
const NETP={fuerte:[.85,400],algo:[.55,200],debil:[.3,90],ninguna:[0,0]};
const AFC=[.7,.55,.45,.4,.35];
const RB=.2961,RC=.4106;
function cuota(m,r,n){const i=Math.pow(1+r,1/12)-1;return m*i/(1-Math.pow(1+i,-n))}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function simulate(p,seed){
  const R=rng(seed);let S=p.sav,arr=0,fat=0,lastBank=-9,intC=0,loanP=0,cardP=0;
  const debts=p.debt>0?[{t:'prev',c:p.debt,left:p.debtLeft||12}]:[];
  let gastos=p.exp;const out=[];
  for(let m=1;m<=24;m++){
    let loss=0,extra=0,ins=0;const ev=[];
    p.sh.forEach(([k,start,dur])=>{if(k==='none')return;const act=m>=start&&m<start+dur;
      if(m===start)ev.push(['shock',k]);
      if(k==='job'&&act){loss+=p.inc*(p.share||0)*(p.share?1:0)+(p.share?0:p.inc*.25);if(p.formal&&p.share)ins+=p.inc*p.share*(AFC[m-start]||0)}
      if(k==='ill'){if(m===start)extra+=500;if(act){extra+=120;loss+=p.inc*(p.share||0)*(p.formal?.15:.5)}}
      if(k==='prices'&&m===start)gastos*=1.12;
      if(k==='repair'&&m===start)extra+=450;});
    loss=Math.min(loss,p.inc);
    const own=p.inc-loss;if(ins>0)ev.push(['ins',ins]);
    const cuotas=debts.reduce((a,d)=>a+d.c,0);const cq={prev:0,bank:0,card:0};debts.forEach(d=>cq[d.t]+=d.c);
    const need=gastos+extra+cuotas;
    const rec={m,own,ins,need,gastos,extra,cuotas,sav:0,cut:0,fam:0,bank:0,card:0,arr:0,surplus:0,famAsk:false};
    let gap=own+ins-need;
    if(gap>=0){rec.surplus=gap;const aust=arr>0?gastos*.06:0;const pay=Math.min(arr,gap+aust);if(pay>1)ev.push(['paid',pay]);arr-=pay;S+=Math.max(0,gap-pay);fat=Math.max(0,fat-.05)}
    else{let D=-gap;
      let u=Math.min(S,D);if(u>1){rec.sav=u;S-=u;D-=u;ev.push(['sav',u])}
      if(D>1){u=Math.min(D,gastos*.08);rec.cut=u;D-=u;ev.push(['cut',u])}
      if(D>1&&p.net!=='ninguna'){rec.famAsk=true;const [pr,cap]=NETP[p.net];if(R()<pr*(1-fat)){u=Math.min(D,cap*(1-fat*.5));rec.fam=u;D-=u;fat=Math.min(.9,fat+.2);ev.push(['famY',u])}else{ev.push(['famN'])}}
      if(D>1&&m-lastBank>=4){const pa=p.formal?(arr>0?.3:.7):(arr>0?.08:.2);lastBank=m;
        if(R()<pa){const prin=Math.round(Math.max(D*2.5,200));const c=cuota(prin,RB,12);debts.push({t:'bank',c,left:12});intC+=c*12-prin;loanP+=prin;rec.loan=prin;rec.bank=D;S+=prin-D;D=0;ev.push(['bankY',prin,c])}else ev.push(['bankN'])}
      if(D>1&&p.card){const used=debts.filter(d=>d.t==='card').reduce((a,d)=>a+d.c*d.left*.88,0);const room=Math.max(0,300-used);u=Math.min(D,room);
        if(u>20){const c=cuota(u,RC,6);debts.push({t:'card',c,left:6});intC+=c*6-u;cardP+=u;rec.card=u;D-=u;ev.push(['card',u,c])}}
      if(D>1){rec.arr=D;arr+=D;ev.push(['arr',D])}
    }
    debts.forEach(d=>d.left--);for(let i=debts.length-1;i>=0;i--)if(debts[i].left<=0)debts.splice(i,1);
    const newDebt=debts.filter(d=>d.t!=='prev').reduce((a,d)=>a+d.c*d.left,0);
    const debtAll=debts.reduce((a,d)=>a+d.c*Math.min(d.left,24),0);
    const shortShare=(rec.sav+rec.cut+rec.fam+rec.bank+rec.card+rec.arr)/need;
    rec.stress=Math.round(Math.max(0,Math.min(100,10+70*Math.min(1,shortShare)+25*Math.min(1,arr/need)+20*Math.min(1,cuotas/Math.max(1,own+ins))+(rec.famAsk?8:0)-(S>need?10:0))));
    Object.assign(rec,{S,arrTot:arr,debtAll,newDebt,ev,cq,intC,loanP,cardP});out.push(rec);
  }
  return out;
}

function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function kfmt(v){const a=Math.abs(v);return (v<0?'−':'')+(a>=1000?(lang==='es'?'$'+(a/1000).toLocaleString('es-CL',{maximumFractionDigits:1})+' M':'$'+(a/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'M'):(lang==='es'?'$'+Math.round(a)+' mil':'$'+Math.round(a)+'k'))}

const LV={run:null,i:-1,t:0,playing:false,speed:1,raf:null,last:0,stale:true,done:false};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const NODES={job:[150,105,'var(--inc)'],state:[150,280,'var(--pub)'],fam:[150,455,'var(--fam)'],bank:[810,105,'var(--debt)'],card:[810,280,'var(--card)'],bills:[810,455,'var(--muted)']};
const ICON={job:'<path d="M4 8h16v11H4z"/><path d="M9 8V5h6v3"/>',state:'<path d="M3 9l9-5 9 5"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/>',fam:'<circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M3 19c1-4 3.5-6 6-6s5 2 6 6"/><path d="M14.5 15c2.6-.4 5 .8 6.5 4"/>',bank:'<path d="M3 9l9-5 9 5"/><path d="M5 10v8M19 10v8M3 20h18"/><path d="M14 11.5c-.4-.9-1.2-1.3-2-1.3-1.1 0-2 .6-2 1.5 0 2 4 1 4 3 0 .9-.9 1.5-2 1.5-.9 0-1.7-.4-2.1-1.3M12 9v1.2M12 16.2v1.3"/>',card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M6 15h4"/>',bills:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'};
const HX=480,HY=210;
function anchor(k){return NODES[k][0]<HX?[418,HY+10]:[542,HY+10]}
function liveInit(){cancelAnimationFrame(LV.raf);Object.assign(LV,{run:simulate(P,P.seed),i:-1,t:0,playing:false,done:false,stale:false});
  LV.smax=Math.max(1,P.sav,...LV.run.map(r=>r.S),LV.run[0].need*1.2);
  document.getElementById('lv-log').innerHTML=`<p class="empty">${t('lvLogEmpty')}</p>`;
  liveCfg();liveSummary();drawStage();}
function liveCfg(){const PR=t('PRESET');const sel=document.getElementById('lv-preset');sel.innerHTML=Object.keys(PRESETS).map(k=>`<option value="${k}" ${P.preset===k?'selected':''}>${PR[k][0]}</option>`).join('');
  const SH=t('SHOCK');const sh=P.sh.filter(x=>x[0]!=='none').map(([k,m,d])=>`${SH[k].toLowerCase()} (${t('monthN')(m).toLowerCase()}${k==='job'||k==='ill'?', '+t('durN')(d):''})`);
  document.getElementById('lv-shocks').innerHTML=`${t('lvShocks')}: ${sh.join(' · ')||t('none').toLowerCase()} · <a href="#laboratorio/tiempo">${t('lvChange')}</a>`;
  document.getElementById('lv-speed').innerHTML=[1,2,4].map(v=>`<button type="button" data-v="${v}" aria-pressed="${LV.speed===v}">${v}×</button>`).join('');
  playLabel();}
function playLabel(){document.getElementById('lv-play').textContent=LV.playing?t('lvPause'):LV.done?t('lvAgain'):LV.i<0?t('lvPlay'):t('lvResume')}
function cur(){return LV.i>=0?LV.run[LV.i]:null}
function flowsOf(r){return {inn:[['job',r.own],['state',r.ins],['fam',r.fam],['bank',r.loan||0],['card',r.card]],out:[['bills',Math.max(0,r.gastos+r.extra-r.cut-r.arr)],['bank',r.cq.prev+r.cq.bank],['card',r.cq.card]]}}
function drawStage(){
  const r=cur(),prev=LV.i>0?LV.run[LV.i-1]:null,late=LV.t>=.5||LV.done;
  const show=r?(late?r:(prev||{S:P.sav,arrTot:0,debtAll:P.debt*(P.debtLeft?Math.min(P.debtLeft,24):0),stress:10})):{S:P.sav,arrTot:0,debtAll:P.debt*Math.min(P.debtLeft||0,24),stress:10};
  const upto=LV.run.slice(0,LV.i+1);const sum=k=>upto.reduce((a,x)=>a+(x[k]||0),0);
  const shockNow=r&&P.sh.some(([k,m,d])=>k!=='none'&&LV.i+1>=m&&LV.i+1<m+((k==='job'||k==='ill')?d:1));
  const jobOff=r&&P.sh.some(([k,m,d])=>k==='job'&&LV.i+1>=m&&LV.i+1<m+d);
  const B={job:jobOff?`<tspan fill="var(--shock-t)">${t('lvJobOff')}</tspan>`:(P.share?t('lvJobOn'):t('lvPension')),state:sum('ins')>0?`${t('lvGave')} ${fmt(sum('ins'))}`:t('lvStateIdle'),fam:sum('fam')>0?`${t('lvGave')} ${fmt(sum('fam'))}`:(P.net==='ninguna'?t('lvNoNet'):t('NET')[P.net]),
    bank:r&&r.loanP?`${t('lvLent')} ${fmt(r.loanP)}`:((r?r.cq.prev+r.cq.bank:P.debt)>.5?`${t('lvInst')} ${fmt(r?r.cq.prev+r.cq.bank:P.debt)}`:t('lvNoDebt')),card:!P.card?t('lvNoCard'):(r&&r.cardP?`${t('lvAdv')} ${fmt(r.cardP)}`:t('lvCardIdle')),
    bills:show.arrTot>1?`<tspan fill="var(--arr)">${t('lvLate')} ${fmt(show.arrTot)}</tspan>`:t('lvOk')};
  const LBL=t('lvNode');const fl=r?flowsOf(r):{inn:[],out:[]};
  const active=new Set();(LV.t<.5?fl.inn:fl.out).forEach(([k,v])=>{if(v>.5&&r&&!LV.done)active.add(k)});
  let s='';
  for(const k in NODES){const [x,y]=NODES[k],[ax,ay]=anchor(k);s+=`<line class="edge${active.has(k)?' on':''}" x1="${x+(x<HX?44:-44)}" y1="${y}" x2="${ax}" y2="${ay}"/>`}
  // particles
  if(r&&!LV.done&&!RM){const ph=LV.t<.5?LV.t/.5:(LV.t-.5)/.5,list=LV.t<.5?fl.inn:fl.out,dir=LV.t<.5?1:-1;
    list.forEach(([k,v])=>{if(v<=.5)return;const n=Math.max(1,Math.min(10,Math.round(v/90)));const [x,y]=NODES[k],[ax,ay]=anchor(k);const sx=x+(x<HX?44:-44);
      const col=k==='bills'?'var(--ink2)':NODES[k][2];
      for(let j=0;j<n;j++){const pr=Math.max(0,Math.min(1,(ph-j/n*.4)/.6));if(pr<=0||pr>=1)continue;const q=dir>0?pr:1-pr;
        s+=`<circle cx="${sx+(ax-sx)*q}" cy="${y+(ay-y)*q}" r="7" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`}})}
  // nodes
  for(const k in NODES){const [x,y,c]=NODES[k];const dim=(k==='card'&&!P.card)||(k==='fam'&&P.net==='ninguna');
    s+=`<g opacity="${dim?.4:1}"><circle cx="${x}" cy="${y}" r="42" fill="var(--bg)" stroke="${c}" stroke-width="${active.has(k)?5:3}"/><g transform="translate(${x-17} ${y-17}) scale(1.42)" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</g>
    <text class="nlabel" x="${x}" y="${y+64}" text-anchor="middle">${LBL[k]}</text><text class="nbadge" x="${x}" y="${y+83}" text-anchor="middle">${B[k]}</text></g>`}
  // house
  const st=show.stress,hc=st<35?'var(--inc)':st<65?'#E0A200':'var(--shock)';
  const lvl=Math.max(0,Math.min(1,show.S/LV.smax)),bh=104;
  s+=`<g><path d="M392 190 L480 118 L568 190" fill="none" stroke="${hc}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
   <rect x="412" y="180" width="136" height="${bh}" rx="6" fill="var(--bg)" stroke="${hc}" stroke-width="4"/>
   <rect x="416" y="${180+bh-4-(bh-8)*lvl}" width="128" height="${(bh-8)*lvl}" rx="3" fill="var(--buf)" opacity=".22"/>
   <text x="480" y="222" text-anchor="middle" style="font-family:var(--f-mono);font-size:12px;fill:var(--muted)">${t('lvSav')}</text>
   <text x="480" y="244" text-anchor="middle" style="font-family:var(--f-mono);font-size:17px;font-weight:500;fill:var(--buf)">${fmt(show.S)}</text>
   ${st>=65?`<path d="M470 180 l-8 22 l12 12 l-9 22 M520 284 l6-18 l-10-10" fill="none" stroke="var(--shock)" stroke-width="2.5" stroke-linecap="round"/>`:''}
   ${shockNow?`<g transform="translate(548 120)"><circle r="22" fill="var(--shock)"/><path d="M2 -12 L-7 2 H0 L-2 12 L7 -2 H0 Z" fill="#fff"/></g>`:''}</g>`;
  // characteristics under the house
  const need=r?r.need:P.exp+P.debt,inc=r?r.own+r.ins:P.inc;
  const rows=[[t('lvRowInc'),fmt(inc),'var(--inc-t)'],[t('lvRowNeed'),fmt(need),'var(--ink)'],[t('lvRowDebt'),fmt(show.debtAll),'var(--debt)'],[t('lvRowArr'),fmt(show.arrTot),show.arrTot>1?'var(--arr)':'var(--ink)']];
  s+=`<g class="props"><rect x="355" y="312" width="250" height="168" rx="14" fill="var(--bg)" stroke="var(--line)"/>`+rows.map((x,j)=>`<text x="372" y="${342+j*27}">${x[0]}</text><text class="v" x="588" y="${342+j*27}" text-anchor="end" style="fill:${x[2]}">${x[1]}</text>`).join('')+
   `<text x="372" y="${342+4*27}">${t('lines').stress}</text><rect x="508" y="${331+4*27}" width="80" height="10" rx="5" fill="var(--surface2)"/><rect x="508" y="${331+4*27}" width="${80*st/100}" height="10" rx="5" fill="${hc}"/></g>`;
  const el=document.getElementById('stage');el.innerHTML=s;el.setAttribute('aria-label',t('lvStageAria'));
  document.getElementById('lv-month').textContent=LV.i<0?t('lvStart'):t('lvMonthOf')(LV.i+1);
  document.getElementById('lv-track').innerHTML=LV.run.map((x,j)=>`<i class="${j<LV.i||(LV.done&&j<=LV.i)?'done':j===LV.i?'cur':''}${x.ev.some(e=>e[0]==='shock')?' sh':''}"></i>`).join('');
}
function evText(e){const E=t('ev'),SH=t('SHOCK'),k=e[0];
  return k==='shock'?`<b>${E.shock(SH[e[1]])}</b>`:k==='ins'?E.ins(fmt(e[1])):k==='sav'?E.sav(fmt(e[1])):k==='cut'?E.cut(fmt(e[1])):k==='famY'?E.famY(fmt(e[1])):k==='famN'?E.famN:k==='bankY'?E.bankY(fmt(e[1]),fmt(e[2])):k==='bankN'?E.bankN:k==='card'?E.card(fmt(e[1]),fmt(e[2])):k==='arr'?`<span style="color:var(--arr)">${E.arr(fmt(e[1]))}</span>`:k==='paid'?E.paid(fmt(e[1])):''}
function enterMonth(i){LV.i=i;LV.t=0;const r=LV.run[i];
  const txt=r.ev.map(evText).join(' ');
  document.getElementById('lv-caption').innerHTML=`<b>${t('monthN')(i+1)}.</b> ${txt||(r.surplus>.5?t('lvQuiet'):'')}`;
  const log=document.getElementById('lv-log');if(i===0)log.innerHTML='';
  if(r.ev.length){log.insertAdjacentHTML('afterbegin',r.ev.map(e=>`<div><span class="mm">${t('monthN')(i+1)}</span><span>${evText(e)}</span></div>`).join(''))}}
function finish(){LV.done=true;LV.playing=false;LV.t=1;drawStage();playLabel();liveSummary();document.getElementById('lv-caption').innerHTML=t('lvEnd')}
function tick(ts){if(!LV.playing)return;const dt=Math.min(100,ts-(LV.last||ts));LV.last=ts;
  LV.t+=dt/(1700/LV.speed);if(LV.t>=1){if(LV.i>=23){finish();return}enterMonth(LV.i+1)}
  drawStage();LV.raf=requestAnimationFrame(tick)}
function play(){if(LV.done){liveInit()}if(LV.i<0)enterMonth(0);LV.playing=true;LV.last=0;playLabel();LV.raf=requestAnimationFrame(tick)}
function pause(){LV.playing=false;cancelAnimationFrame(LV.raf);playLabel()}
document.getElementById('lv-play').onclick=()=>LV.playing?pause():play();
document.getElementById('lv-step').onclick=()=>{pause();if(LV.done)return;if(LV.i>=23){finish();return}enterMonth(LV.i+1);LV.t=1;drawStage()};
document.getElementById('lv-reset').onclick=()=>{pause();liveInit()};
document.getElementById('lv-speed').onclick=e=>{const b=e.target.closest('button');if(!b)return;LV.speed=+b.dataset.v;liveCfg()};
document.getElementById('lv-preset').onchange=e=>{pause();loadPreset(e.target.value);selM=P.sh[0][0]==='none'?1:P.sh[0][1];buildSimControls();runSim();liveInit()};
function mcStats(){const N=400;let arrEnd=0,card=0;const debts=[],hs=[];
  for(let i=0;i<N;i++){const s=simulate(P,1000+i);const last=s[23];if(last.arrTot>1)arrEnd++;if(s.some(r=>r.card>0))card++;debts.push(last.newDebt);hs.push(s.filter(r=>r.stress>=65).length)}
  const med=a=>{a.sort((x,y)=>x-y);return a[Math.floor(a.length/2)]};return {arr:Math.round(arrEnd/N*100),card:Math.round(card/N*100),debt:med(debts),hs:med(hs)}}
function liveSummary(){const box=document.getElementById('lv-sum');
  if(!LV.done){box.innerHTML=`<h3>${t('lvSumT')}</h3><p class="sub">${t('lvSumWait')}</p>`;return}
  const R=LV.run,last=R[23];const S=t('lvS');
  const def=R.filter(r=>r.need-r.own-r.ins>.5).length,fam=R.reduce((a,r)=>a+r.fam,0),hs=R.filter(r=>r.stress>=65).length,mc=mcStats();
  box.innerHTML=`<h3>${t('lvSumT')}</h3><p class="sub">${t('lvSumS')}</p><div class="sumgrid">
   <div class="stat"><b>${def}</b><span>${S.def}</span></div><div class="stat"><b>${fmt(fam)}</b><span>${S.fam}</span></div>
   <div class="stat"><b>${fmt(last.loanP+last.cardP)}</b><span>${S.loans}</span></div><div class="stat"><b>${fmt(last.intC)}</b><span>${S.int}</span></div>
   <div class="stat"><b style="color:${last.arrTot>1?'var(--arr)':'inherit'}">${fmt(last.arrTot)}</b><span>${S.arr}</span></div><div class="stat"><b>${hs}</b><span>${S.hs}</span></div></div>
   <p style="margin-top:14px;font-size:15px">${t('lvMc')(mc.arr,mc.card)}</p>`}

applyLang();lastView=(location.hash||'#inicio').slice(1).split('/')[0];
</script>
